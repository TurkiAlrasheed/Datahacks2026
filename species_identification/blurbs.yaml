    behavior: They produce a deep, resonant "prruk-prruk" or "gronk" call; deeper than a crow's
      caw; known for their problem-solving skills and playful nature
    notable: Known to break off twigs to play with other ravens; they mate for life, with
      partners known to serenade each other.
    size_prose: The Common raven measures 54 to 69 centimeters in length, with a wingspan
      of 115 to 150 centimeters and a weight of 0.7 to 1.63 kilograms.
    appearance_prose: The Common raven is an all-black passerine bird with little variation
      in appearance, a heavy, curved beak, shaggy throat feathers, larger than a crow, and
      a more robust bill and wedge-shaped tail.
    behavior_prose: The Common raven produces a deep, resonant 'prruk-prruk' or 'gronk' call
