blurbs:
  Allograpta_obliqua:
    reviewed: true
    source: wikipedia:Allograpta obliqua
    common_name: oblique streaktail hoverfly
    dangerous_to_humans: 'no'
    dangerous_to_pets: 'no'
    size: 6-9 mm body length
    appearance: black and yellow striped abdomen and thorax, clear wings with dark veins,
      large compound eyes
    habitat: gardens, meadows, agricultural fields across North America
    diet: adults eat nectar and pollen, larvae eat aphids - a sap-sucking insect
    behavior: males have holoptic eyes, females dichoptic
    notable: they are hyperfocused when on a flower, ignoring cameras and fingers getting
      close
    size_prose: The oblique streaktail hoverfly is 6 to 9 millimeters long.
    appearance_prose: The oblique streaktail hoverfly has a black-and-yellow striped abdomen
      and thorax, clear wings with dark veins, and large compound eyes.
    behavior_prose: The oblique streaktail hoverfly has males with holoptic eyes and females
      with dichoptic eyes.
    notable_prose: The orchid bee is hyperfocused when on a flower, ignoring cameras and fingers
      getting close.
    prose_reviewed: true
    diet_prose: The oblique streaktail hoverfly adults eat nectar and pollen, while their
      larvae eat aphids, which are sap-sucking insects.
  Apis_mellifera:
    reviewed: true
    source: wikipedia:Western honey bee
    common_name: Western honey bee
    dangerous_to_humans: mild
    dangerous_to_pets: mild
    size: 12-20 mm body length, 10-20 mm wingspan
    appearance: Dark brown striped bodies with hairy legs
    habitat: Every continent except Antarctica; adapted to local environments
    diet: Nectar, pollen, honey
    behavior: Dirunal, eusocial, complex communication through pheromones and waggle dance
    notable: With 170 odorant receptors, they have a sense of smell 50 times more powerful
