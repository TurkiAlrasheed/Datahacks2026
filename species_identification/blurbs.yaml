    size_prose: The Western honey bee measures 12 to 20 millimeters in body length and has
      a wingspan of 10 to 20 millimeters.
    appearance_prose: The striped harvestman has dark brown striped bodies with hairy legs.
    behavior_prose: The Western honey bee is diurnal, eusocial, and communicates complexly
      through pheromones and waggle dance.
    notable_prose: The bloodhound has a sense of smell 50 times more powerful than a dog with
      170 odorant receptors.
    prose_reviewed: true
    diet_prose: The Western honey bee feeds on nectar, pollen, and honey.
  Artemisia_californica:
    reviewed: true
