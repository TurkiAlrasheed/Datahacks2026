  Corvus_corax:
    reviewed: true
    source: wikipedia:Common raven
    common_name: Common raven
    dangerous_to_humans: 'no'
    dangerous_to_pets: 'yes'
    size: 54-69 cm length, 115-150 cm wingspan, 0.7-1.63 kg weight
    appearance: All-black passerine bird with little variation in appearance; heavy, curved
      beak, shaggy throat feathers; larger than a crow, with a more robust bill and wedge-shaped
